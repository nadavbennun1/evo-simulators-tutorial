name: Build public workshop Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evolution_simulators.ipynb"
      - "SBI_tutorial.ipynb"
      - "workshop_site/**"
      - ".github/workflows/workshop-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workshop_site/requirements-build.txt
      - run: python -m pip install -r workshop_site/requirements-build.txt pytest
      - name: Verify derived assets and build notebook content
        run: python workshop_site/build_site.py
      - name: Test static site
        run: python -m pytest workshop_site/tests -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: workshop_site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
