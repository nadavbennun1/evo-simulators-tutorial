<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="430" viewBox="0 0 1800 430" role="img" aria-labelledby="title desc">
  <title id="title">Time-aware embedding for flexible neural posterior estimation</title>
  <desc id="desc">Irregular frequency observations and their times, mask, and experimental context pass through a time-aware embedding into one neural posterior estimator.</desc>
  <defs>
    <style>
      .h{font:700 27px system-ui,sans-serif;fill:#21312c}.s{font:700 19px system-ui,sans-serif;fill:#315f52}.t{font:500 17px system-ui,sans-serif;fill:#607069}.m{font:italic 25px Georgia,serif;fill:#21312c}.axis{stroke:#21312c;stroke-width:2}.grid{stroke:#d8d2c5;stroke-width:1}.arrow{stroke:#b56a50;stroke-width:5;fill:none;marker-end:url(#tip)}.curve1{stroke:#577d91;stroke-width:4;fill:none}.curve2{stroke:#b56a50;stroke-width:4;fill:none}.node{fill:#fffdf8;stroke:#aebfaa;stroke-width:2}.box{fill:#e4eadf;stroke:#315f52;stroke-width:3}.network{stroke:#607069;stroke-width:1.2;opacity:.7}.density1{stroke:#315f52;stroke-width:4;fill:none}.density2{stroke:#b56a50;stroke-width:4;fill:none}
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b56a50"/></marker>
  </defs>
  <rect width="1800" height="430" rx="26" fill="#fffdf8"/>
  <text class="h" x="42" y="42">IRREGULAR OBSERVATIONS</text>
  <g transform="translate(45 72)"><line class="axis" x1="10" y1="125" x2="320" y2="125"/><line class="axis" x1="10" y1="125" x2="10" y2="5"/><path class="curve1" d="M12 120 C80 118 95 95 145 75 S215 20 310 18"/><g fill="#315f52" stroke="#fff" stroke-width="2"><circle cx="24" cy="118" r="6"/><circle cx="75" cy="109" r="6"/><circle cx="140" cy="78" r="6"/><circle cx="220" cy="35" r="6"/><circle cx="290" cy="18" r="6"/></g><text class="t" x="8" y="154">frequency trajectory 1</text></g>
  <g transform="translate(45 250)"><line class="axis" x1="10" y1="125" x2="320" y2="125"/><line class="axis" x1="10" y1="125" x2="10" y2="5"/><path class="curve2" d="M12 121 C70 119 110 113 148 91 S230 35 310 16"/><g fill="#b56a50" stroke="#fff" stroke-width="2"><circle cx="18" cy="120" r="6"/><circle cx="92" cy="115" r="6"/><circle cx="150" cy="90" r="6"/><circle cx="250" cy="27" r="6"/><circle cx="310" cy="16" r="6"/></g><text class="t" x="8" y="154">frequency trajectory 2</text></g>
  <path class="arrow" d="M390 210 H510"/>
  <g transform="translate(525 82)"><text class="h" x="0" y="0">TIME-UNIFYING INPUT</text><g transform="translate(5 38)"><rect class="node" x="0" y="0" width="128" height="72" rx="12"/><rect class="node" x="145" y="0" width="128" height="72" rx="12"/><rect class="node" x="0" y="90" width="128" height="72" rx="12"/><rect class="node" x="145" y="90" width="128" height="72" rx="12"/><text class="s" x="64" y="24" text-anchor="middle">time</text><text class="m" x="64" y="56" text-anchor="middle">tⱼ</text><text class="s" x="209" y="24" text-anchor="middle">observation</text><text class="m" x="209" y="56" text-anchor="middle">xⱼ</text><text class="s" x="64" y="114" text-anchor="middle">mask</text><text class="m" x="64" y="146" text-anchor="middle">mⱼ</text><text class="s" x="209" y="114" text-anchor="middle">context</text><text class="m" x="209" y="146" text-anchor="middle">cⱼ</text></g></g>
  <path class="arrow" d="M815 210 H900"/>
  <g transform="translate(915 94)"><rect class="box" width="240" height="220" rx="28"/><text class="m" x="120" y="64" text-anchor="middle">Eψ</text><text class="h" x="120" y="116" text-anchor="middle">time-aware</text><text class="h" x="120" y="151" text-anchor="middle">embedding</text><text class="t" x="120" y="190" text-anchor="middle">summary S</text></g>
  <path class="arrow" d="M1170 210 H1250"/>
  <g transform="translate(1270 56)"><text class="h" x="130" y="0" text-anchor="middle">ONE NPE</text><g transform="translate(10 42)"><g class="network"> <line x1="0" y1="40" x2="100" y2="10"/><line x1="0" y1="40" x2="100" y2="90"/><line x1="0" y1="120" x2="100" y2="10"/><line x1="0" y1="120" x2="100" y2="90"/><line x1="100" y1="10" x2="200" y2="45"/><line x1="100" y1="90" x2="200" y2="45"/><line x1="100" y1="170" x2="200" y2="125"/><line x1="100" y1="90" x2="200" y2="125"/></g><g fill="#577d91" stroke="#21312c" stroke-width="1.5"><circle cx="0" cy="40" r="13"/><circle cx="0" cy="120" r="13"/><circle cx="100" cy="10" r="13"/><circle cx="100" cy="90" r="13"/><circle cx="100" cy="170" r="13"/><circle cx="200" cy="45" r="13"/><circle cx="200" cy="125" r="13"/></g><text class="m" x="100" y="220" text-anchor="middle">qφ(θ | S)</text></g></g>
  <path class="arrow" d="M1490 210 H1560"/>
  <g transform="translate(1580 58)"><text class="h" x="92" y="0" text-anchor="middle">FLEXIBLE POSTERIOR</text><line class="axis" x1="0" y1="292" x2="185" y2="292"/><line class="axis" x1="0" y1="292" x2="0" y2="45"/><path class="density1" d="M3 291 C38 290 45 92 84 76 S130 285 182 291"/><path class="density2" d="M3 291 C55 291 65 95 106 84 S145 286 182 291"/><text class="m" x="92" y="330" text-anchor="middle">parameter θ</text></g>
</svg>
